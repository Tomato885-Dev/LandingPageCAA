       ========================================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- ==========================================================================
       ESTILOS PROPIOS (colores y efecto vidrio) → src/estilos/theme.css
       ========================================================================== -->
  <link rel="stylesheet" href="src/estilos/theme.css" />

  <!-- ==========================================================================
       LIBRERÍAS (no hace falta instalar nada: se cargan desde internet)
       ========================================================================== -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Configuración de Tailwind: tipografías y colores del proyecto.
    // Los colores apuntan a las variables definidas en src/estilos/theme.css
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['"Instrument Serif"', 'serif'],
            body: ['"Barlow"', 'sans-serif'],
          },
          colors: {
            fondo: 'var(--color-fondo)',
            acento: 'var(--color-acento)',
            'acento-texto': 'var(--color-acento-texto)',
          },
          borderRadius: {
            DEFAULT: '9999px',
            tarjeta: 'var(--radio-tarjeta)',
          },
        },
      },
    };
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
  <script>
    // Framer Motion se expone con distintos nombres según la versión.
    window.Motion = window.FramerMotion || window.Motion || {};
    // Silencia avisos benignos de Framer Motion sobre "keys" en listas animadas.
    (function () {
      var errorOriginal = console.error;
      console.error = function () {
        var primero = arguments[0];
        if (typeof primero === 'string' && primero.indexOf('Each child in a list') !== -1) return;
        errorOriginal.apply(console, arguments);
      };
    })();
  </script>
</head>
